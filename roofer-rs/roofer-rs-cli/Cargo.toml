[package]
name = "roofer-rs-cli"
description = "Command-line interface for Roofer building reconstruction"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "roofer-rs"
path = "src/main.rs"

[features]
default = []
# FCB output (pulls in OpenSSL)
fcb = ["roofer-rs-io/fcb"]

[dependencies]
# Workspace crates
roofer-rs-geometry = { workspace = true }
roofer-rs-io = { workspace = true }

# CLI
clap = { workspace = true }
indicatif = { workspace = true }

# Concurrency
rayon = { workspace = true }
crossbeam-channel = { workspace = true }

# Spatial indexing
rstar = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization (for config)
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Spatial reference (for optional output reprojection)
gdal = { workspace = true }

